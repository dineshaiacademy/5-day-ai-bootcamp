[theme]
base = "dark"
primaryColor = "#7C6FF0"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#141824"
textColor = "#E6E8F0"
linkColor = "#9B8CFF"
borderColor = "#262B3A"
codeBackgroundColor = "#161B2A"
codeTextColor = "#C9CEDA"

redColor = "#FF5C5C"
orangeColor = "#F5A623"
yellowColor = "#E8C547"
greenColor = "#2ECC71"
blueColor = "#5B8DEF"
violetColor = "#9B8CFF"
grayColor = "#8891A5"

chartCategoricalColors = ["#7C6FF0", "#5B8DEF", "#2ECC71", "#F5A623", "#FF5C5C", "#9B8CFF", "#8891A5"]

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0F1320"
secondaryBackgroundColor = "#161B2A"
textColor = "#E6E8F0"
borderColor = "#262B3A"
primaryColor = "#7C6FF0"
